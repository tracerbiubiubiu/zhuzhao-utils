name: CI

on:
  push:
    branches: ["**"]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# 连续 push 只跑最新提交（对齐 activelist/taskrunner 惯例）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit policy negative checks
        run: make test-commit-lint
      - name: Exact push or PR commit window
        run: python3 scripts/commit-policy.py ci --fetch-missing
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: ["1.26.11", "1.27.4"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan (current source and tests)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
