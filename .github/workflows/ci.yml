name: CI

on:
  push:
    branches: ["**"]
    tags: ['v*']
  pull_request:

# 连续 push 只跑最新提交（对齐 activelist/taskrunner 惯例）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...
